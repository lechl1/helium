app-id: net.imput.helium
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.chromium.Chromium.BaseApp
base-version: '25.08'
command: helium
separate-locales: false
build-options:
  no-debuginfo: true

# Permissions modelled on the upstream Flathub Brave manifest
# (com.brave.Browser), since Helium is also a Chromium fork and needs the
# same host access. Brave-specific names have been swapped for Helium's.
finish-args:
  - --require-version=1.8.2
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=cups
  - --socket=pcsc # FIDO2
  - --socket=pulseaudio
  - --socket=x11
  - --socket=wayland
  - --allow=bluetooth # FIDO2 CTAP hybrid transport
  - --system-talk-name=org.bluez
  - --system-talk-name=org.freedesktop.Avahi
  - --system-talk-name=org.freedesktop.UPower
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.gnome.ScreenSaver
  - --talk-name=org.gnome.Mutter.IdleMonitor.*
  - --talk-name=org.cinnamon.ScreenSaver
  - --talk-name=org.mate.ScreenSaver
  - --talk-name=org.xfce.ScreenSaver
  # Chromium forks register MPRIS under the product name. Helium is built on
  # ungoogled-chromium, which keeps the upstream "chromium" bus name; the
  # "helium" variant is owned too in case of a rebrand. Adjust if media keys
  # don't bind.
  - --own-name=org.mpris.MediaPlayer2.chromium.*
  - --own-name=org.mpris.MediaPlayer2.helium.*
  - --filesystem=/run/.heim_org.h5l.kcm-socket
  - --filesystem=xdg-run/pipewire-0
  # To load policies from the host /etc/helium/policies
  - --filesystem=host-etc
  # To install a PWA application
  - --filesystem=home/.local/share/applications:create
  - --filesystem=home/.local/share/icons:create
  # To allow installing shortcuts on the desktop
  - --filesystem=xdg-desktop
  # For default download directory to work as expected
  - --filesystem=xdg-download
  # For MPRIS media cover art
  - --filesystem=/tmp
  # For imported CA certificates
  - --persist=.pki
  # For GNOME proxy resolution
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf
  - --env=GIO_EXTRA_MODULES=/app/lib/gio/modules
  - --env=GSETTINGS_BACKEND=dconf
  # Set the release channel string reported in chrome://version
  - --env=CHROME_VERSION_EXTRA=flatpak
  # For KDE proxy resolution (KDE5 only)
  - --filesystem=~/.config/kioslaverc

modules:
  # GNOME proxy resolution backend (same module Brave/Chromium use).
  - name: dconf
    buildsystem: meson
    config-opts:
      - -Dbash_completion=false
      - -Dman=false
      - -Dvapi=false
    cleanup:
      - /etc
      - /include
      - ca.desrt.dconf.service
      - dconf.service
      - dconf-service
      - '*.pc'
    sources:
      - type: archive
        url: https://download.gnome.org/sources/dconf/0.49/dconf-0.49.0.tar.xz
        sha256: 16a47e49a58156dbb96578e1708325299e4c19eea9be128d5bd12fd0963d6c36
        x-checker-data:
          type: gnome
          name: dconf
          stable-only: true
      # From: https://src.fedoraproject.org/rpms/dconf
      - type: patch
        path: dconf-override.patch

  # Redirects Chromium's setuid/namespace sandbox through flatpak-spawn so the
  # sandbox works inside the Flatpak container.
  - name: zypak
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2025.09
        commit: 693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: helium
    buildsystem: simple
    build-commands:
      - install -d /app/helium
      - cp -a helium/. /app/helium/
      - install -Dm755 helium.sh /app/bin/helium
      - install -Dm644 net.imput.helium.metainfo.xml /app/share/metainfo/net.imput.helium.metainfo.xml
      - install -Dm644 /app/helium/product_logo_256.png /app/share/icons/hicolor/256x256/apps/net.imput.helium.png
      - install -Dm644 /app/helium/helium.desktop /app/share/applications/net.imput.helium.desktop
      - sed -i 's/^Icon=helium/Icon=net.imput.helium/' /app/share/applications/net.imput.helium.desktop
    sources:
      - type: archive
        url: https://github.com/imputnet/helium-linux/releases/download/0.12.5.1/helium-0.12.5.1-x86_64_linux.tar.xz
        sha256: b5f8b2d4c9315eaf6f3a3a79ed1df29078e5786d158b3fc2dadb705db1e73f00
        dest: helium
        only-arches: [x86_64]
      - type: archive
        url: https://github.com/imputnet/helium-linux/releases/download/0.12.5.1/helium-0.12.5.1-arm64_linux.tar.xz
        sha256: aba702aef0e1f5e61067008b02b297643a58925d19ce2da0f60a7d97e1be4080
        dest: helium
        only-arches: [aarch64]
      - type: file
        path: helium.sh
      - type: file
        path: net.imput.helium.metainfo.xml
